# Compile-and-test gate for the native iOS app. Free on this public repo
# (GitHub-hosted runners), so it runs on every change under ios/ — unlike
# Codemagic, which is reserved for signing and distribution and is only ever
# started by hand (see codemagic.yaml).
name: iOS

on:
  push:
    branches: [native-ios, main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dripkit-linux:
    name: DripKit tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path ios/DripKit

  ios:
    name: iOS build + simulator tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: DripKit tests (macOS host)
        run: swift test --package-path ios/DripKit

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: DripKit tests (iOS Simulator — compiles every SwiftUI screen)
        working-directory: ios/DripKit
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme DripKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            | tee ../../dripkit-ios-test.log | grep -E "error:|warning: .*DripKit|Test Suite|Executed|\*\* " || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned, device, Release)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Drip.xcodeproj -scheme Drip -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee ../app-build.log | grep -E "error:|\*\* " || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            dripkit-ios-test.log
            app-build.log
          if-no-files-found: ignore
